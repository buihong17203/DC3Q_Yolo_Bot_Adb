    mail_claim: data/img/templates/targets/05_khong-gian-ca-nhan/screen/screen_cb_nt_tab_chiase_button_chuanhan.png
    mail_claimed: data/img/templates/targets/05_khong-gian-ca-nhan/screen/screen_cb_nt_tab_chiase_button_danhan.png
    mail_delete: data/img/templates/targets/05_khong-gian-ca-nhan/screen/screen_cb_nt_tab_chiase_button_xoathu.png
