    panel: data/img/templates/targets/05_khong-gian-ca-nhan/screen/screen_chiase_chiase.png
    button: data/img/templates/targets/05_khong-gian-ca-nhan/screen/screen_chiase_chiase.png
    after:
      - data/img/templates/targets/05_khong-gian-ca-nhan/screen/screen_thongtincuatoi.png
