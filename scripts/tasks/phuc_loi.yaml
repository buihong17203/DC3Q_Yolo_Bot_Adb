name: dc3q_phuc_loi

steps:
  - action: phuc_loi
    account_id: "${account.id}"
    runtime_file: "data/accounts/account_runtime.json"
    package: "com.daichien.mobile"
    activity: "com.qtz.game.main.Logo"

    # Chạy toàn bộ Phúc lợi sau Tam Quốc Lệnh.
    # Điểm danh được xử lý bên trong action này và có runtime riêng để resume.
    mode: "full"
    skip_checkin: false
    claim_checkin: true
    checkin_claim_threshold: 0.68

    # Điểm danh mới: Điểm danh bù -> tick cuối -> ngày 1 tháng mới.
    # Không dùng quầng sáng và không dùng tọa độ ô cố định.
    checkin_click_retries: 3
    checkin_reference_threshold: 0.70

    checkin_makeup_templates:
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_bu_text.png"
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_bu.png"
    checkin_tick_templates:
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_tick.png"
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_checkmark.png"
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_checked.png"
    checkin_day1_templates:
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_day_1.png"
      - "dc3q/targets/Hoạt-Động/Phúc-Lợi/Điểm-Danh/screen_diem_danh_1.png"

    # Chỉ xử lý Hoạt động -> Phúc lợi.
    # Hai tab cấp cao "Ngày lễ" và "Hoạt động" hiện cố ý bỏ qua.
    threshold: 0.90
    entry_threshold: 0.82
    tab_threshold: 0.80
    state_threshold: 0.90
    bao_state_threshold: 0.80
    reward_threshold: 0.90
    close_threshold: 0.90
    home_threshold: 0.75

    # Chờ chuyển trạng thái UI thay vì click liên tiếp theo thời gian cố định.
    open_timeout: 12
    state_timeout: 8
    timeout: 30
    interval: 0.5

    # Quà online: chỉ nhận khi game báo đủ thời gian online.
    # Nếu đang progress/locked/chưa đạt thì ghi PENDING và đi tiếp, không chờ 1-2 giờ.
    max_online_claims: 8
    max_online_scrolls: 3

    # Trưng thu thuế: chỉ thao tác trong các khung giờ dưới đây.
    # Ngoài giờ ghi SKIPPED / OUTSIDE_TIME_WINDOW, không coi là lỗi.
    tax_windows:
      - "12:00-14:00"
      - "18:00-20:00"
      - "21:00-23:00"

    # Giới hạn bảo vệ để không cuộn/click vô hạn khi giao diện thay đổi.
    max_menu_scrolls: 4
